<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Mingguan</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--card2:#1c232d;--line:#2a323d;--tx:#e6edf3;--mut:#8b96a5;--ac:#7c9cff;--ac2:#a78bfa;--ok:#3fb950;--warn:#f0b429;--bad:#f85149;--focus:#7c9cff;--rest:#8b96a5;--sehat:#3fb950;--reward:#f0b429;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--card:#fff;--card2:#f6f8fb;--line:#e1e6ee;--tx:#1b2330;--mut:#667386;--ac:#4f6df5;--ac2:#7c4dff;--ok:#1a9a3a;--warn:#c98a00;--bad:#d1242f;--focus:#4f6df5;--rest:#8a94a3;--sehat:#1a9a3a;--reward:#c98a00}}
:root[data-theme="dark"]{--bg:#0d1117}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--ac2) 18%,transparent),transparent),radial-gradient(700px 400px at -10% 0,color-mix(in srgb,var(--ac) 16%,transparent),transparent);background-repeat:no-repeat}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:13px}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;text-align:right;line-height:1}
.clock small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin}
.tab{flex:0 0 auto;min-width:84px;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font:inherit;transition:.2s}
.tab b{display:block;font-size:14px}.tab span{font-size:12px;color:var(--mut)}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px var(--ac)}
.tab.on span{color:#ffffffcc}
.tab.today b::after{content:" •";}
.now{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:6px 0 14px;display:flex;gap:12px;align-items:center}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 var(--ok);animation:p 1.8s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.now small{color:var(--mut);display:block;font-size:12px}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.prog .r{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:99px;transition:width .5s}
.bar.w i{background:linear-gradient(90deg,var(--ok),#7ee787)}
.list{display:grid;gap:8px}
